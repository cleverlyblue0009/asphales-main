<!DOCTYPE html>
<html>
<head>
 <meta charset="UTF-8">
 <style>
 body {
 width: 380px;
 padding: 0;
 font-family: 'Segoe UI', Arial, sans-serif;
 margin: 0;
 background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
 }
 .container {
 background: white;
 border-radius: 12px;
 margin: 20px;
 padding: 20px;
 }
 .header {
 display: flex;
 justify-content: space-between;
 align-items: center;
 margin-bottom: 15px;
 }
 h2 {
 margin: 0;
 color: #333;
 font-size: 20px;
 flex: 1;
 }
 .shield-icon { font-size: 30px; }
 .lang-selector {
 padding: 6px 10px;
 border: 1px solid #ddd;
 border-radius: 4px;
 font-size: 12px;
 cursor: pointer;
 background: white;
 }
 .status {
 padding: 12px;
 border-radius: 8px;
 margin: 15px 0;
 font-weight: bold;
 text-align: center;
 transition: all 0.3s;
 }
 .status.active { background: #4CAF50; color: white; }
 .status.inactive { background: #f0f0f0; color: #666; }
 button {
 width: 100%; padding: 14px; font-size: 16px; font-weight: bold; cursor: pointer;
 border: none; border-radius: 8px; background: #2196F3; color: white; transition: all 0.3s;
 }
 button:hover { background: #1976D2; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
 .info { margin-top: 15px; padding: 10px; background: #e3f2fd; border-radius: 6px; font-size: 13px; color: #1976D2; }
 .scan-summary { margin-top: 12px; font-size: 13px; color: #222; background: #f6f7ff; border-radius: 6px; padding: 10px; display: none; }
 .critical-line { margin-top: 10px; padding: 12px; background: #fff3cd; border-left: 4px solid #ff9800; border-radius: 4px; font-size: 12px; color: #333; display: none; }
 .critical-line-label { font-weight: 700; color: #ff6f00; font-size: 11px; margin-bottom: 5px; }
 .critical-line-text { word-break: break-word; font-family: monospace; font-size: 11px; color: #555; }
 .threat-list { margin-top: 10px; max-height: 250px; overflow-y: auto; }
 .threat-item { background: #fff4f4; border: 1px solid #ffc7c7; border-radius: 6px; padding: 10px; margin-bottom: 8px; border-left: 4px solid #f44336; }
 .threat-item.red { border-left-color: #f44336; background: #ffebee; }
 .threat-item.yellow { border-left-color: #ff9800; background: #fff8e1; border-color: #ffe0b2; }
 .threat-item.orange { border-left-color: #ff6f00; background: #fff3e0; border-color: #ffe0b2; }
 .threat-item.safe { background: #f1fff4; border-color: #b6efc2; border-left-color: #4caf50; }
 .threat-head { font-size: 12px; font-weight: 700; color: #c62828; display: flex; justify-content: space-between; }
 .severity-badge { padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: bold; }
 .severity-red { background: #f44336; color: white; }
 .severity-yellow { background: #ff9800; color: white; }
 .severity-orange { background: #ff6f00; color: white; }
 .threat-phrase { font-size: 12px; margin-top: 6px; color: #333; word-break: break-word; font-weight: 500; }
 .threat-explain { font-size: 11px; margin-top: 6px; color: #555; line-height: 1.4; }
 .highlight-note { font-size: 10px; margin-top: 8px; color: #666; font-style: italic; }
 .threat-count { font-size: 12px; padding: 8px 12px; background: #e3f2fd; border-radius: 6px; margin-bottom: 10px; color: #1976D2; font-weight: 600; text-align: center; }
 </style>
</head>
<body>
 <div class="container">
 <div class="header">
  <h2><span class="shield-icon">🛡️</span> Shield</h2>
  <select class="lang-selector" id="langSelector" title="Interface Language">
   <option value="en">English</option>
   <option value="hi">हिंदी</option>
  </select>
 </div>
 <div class="status inactive" id="status">Protection: OFF</div>
 <button id="toggleBtn">Activate Protection</button>
 <div class="info" id="info" style="display: none;">Scanning webpage for phishing threats...</div>
 <div class="scan-summary" id="scanSummary"></div>
 <div class="critical-line" id="criticalLine">
  <div class="critical-line-label">🚨 Critical Line:</div>
  <div class="critical-line-text" id="criticalLineText"></div>
 </div>
 <div class="threat-list" id="threatList"></div>
 </div>
 <script src="popup.js"></script>
</body>
</html>
